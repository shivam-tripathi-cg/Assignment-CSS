<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <style>
        /* Reset & Base Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background-color: #141414;
    color: #ffffff;
    overflow-x: hidden;
}

.head{
    width: 100vw;
    height: 100vh;
}
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 50px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0))
}

.nav-left {
    display: flex;
    align-items: center;
    gap: 30px;
}

.logo {
    color: #e50914;
    font-size: 24px;
    font-weight: bold;
    letter-spacing: 2px;
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 20px;
}

.nav-links a {
    color: #e5e5e5;
    text-decoration: none;
    font-size: 14px;
}

.nav-links a:hover {
    color: #b3b3b3;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 18px;
    cursor: pointer;
}
.nav-right>div{
    width: 20px;
    height: 20px;
}

.profile-icon {
    width: 32px;
    height: 32px;
    background-color: #333;
    border-radius: 4px;
}
.head-down{
    height: 350px;
    width: 700px;
    display: flex;
    flex-direction: column;
    position: absolute;
    margin-top: 420px;
}
.head-head-down{
    width: 120px;
    height: 40px;
    margin-left: 60px;
}
.maid{
    font-size: 150px;
    margin-left: 50px;
    font-weight: 600;
}
.down-head{
    width: 200px;
    height: 40px;
    margin-left:60px ;
    display: flex;
}
.play{
    width: 80px;
    height: 35px;
    border-radius: 5%;
    background-color: white;
    display: flex;
    align-items:center;
    justify-content: center;
}
.right-arrow{
    height: 20px;
    width: 20px;
    background-image: url(Play.png);
    background-size: cover;
}
.playin{
    font-weight: 600;
    letter-spacing: 1.5px;
    color: black;
    margin-left: 1px;
}
.more-info{
    height: 35px;
    width: 120px;
    background-color: rgba(255, 255, 255, 0.384);
}
    </style>
</head>
<body>
   <div class="head" style="background-image: url(Title-Image.png);background-size: cover;">
    <header class="navbar">
        <div class="nav-left">
            <div class="netflix-logo" style="background-image: url(NetflixLogoSvg.png); background-size: cover;width: 100px;height: 26px;"></div>
            <ul class="nav-links">
                <li><a href="#">Start</a></li>
                <li><a href="#">Shows</a></li>
                <li><a href="#">Movies</a></li>
                <li><a href="#">New</a></li>
                <li><a href="#">My List</a></li>
            </ul>
        </div>
        <div class="nav-right">
            <div class="search" style="background-image: url(Search.png);background-size: cover;"></div>
            <div class="gift" style="background-image: url(GiftBox.png);background-size: cover;"></div>
            <div class="notification" style="background-image: url(NotificationBell.png);background-size: cover;"></div>
            <div class="profile-icon" style="background-image: url(ProfileIMG.png);background-size: cover;width: 30px;height: 30px;"></div>
            <div class="drop-arrow" style="background-image: url(DownArrow.png);background-size: cover;width: 10px;height: 10px;margin-left: -15px;"></div>
        </div>
    </header>
    <div class="head-down">
        <div class="head-head-down" style="display: flex;">
            <div class="n-logo" style="width: 22px;height: 35px;background-image: url(Netflix_Symbol_RGB\ 1.png);background-size: cover;"></div>
            <div class="show" style="align-self: center;font: weight 800;;letter-spacing:4px ;margin-left: 8px;">SHOW</div>
        </div>
        <div class="maid">MAID</div>
        <div class="down-head">
            <div class="play">
                <div class="right-arrow"></div>
                <div class="playin">Play</div>
            </div>
            <div class="moreinfo">
                <div class="exclamation"></div>
                <div class="morreinfo"></div>
            </div>
        </div>
    </div>
    </div>
</body>
</html>
